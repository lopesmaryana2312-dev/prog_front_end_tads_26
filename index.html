<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e1014">
    <title>Projetos | Programação Front-end</title>
    <style>
        @font-face {
            font-family: "Poppins";
            src: url("tecboard/fonts/Poppins-Bold.ttf") format("truetype");
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: "Roboto";
            src: url("tecboard/fonts/Roboto-Bold.ttf") format("truetype");
            font-weight: 700;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            min-height: 100vh;
            padding: 48px 24px;
            background: #0e1014;
            color: #fff;
            font-family: "Roboto", Arial, sans-serif;
        }

        main {
            width: min(100%, 900px);
            margin: 0 auto;
        }

        header {
            margin-bottom: 72px;
        }

        header img {
            display: block;
            width: min(100%, 205px);
            height: auto;
        }

        h1 {
            font-family: "Poppins", sans-serif;
            font-size: clamp(2.5rem, 7vw, 4rem);
            line-height: 1.15;
        }

        h1 span {
            color: #9747ff;
        }

        .intro {
            margin-top: 20px;
            color: #d3d3d8;
            font-size: 1.125rem;
            line-height: 1.6;
        }

        h2 {
            margin: 48px 0 16px;
            font-family: "Poppins", sans-serif;
            font-size: 1.5rem;
        }

        ul {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
            gap: 16px;
            padding: 0;
            list-style: none;
        }

        a {
            display: block;
            min-height: 100%;
            padding: 24px;
            border: 1px solid #39313f;
            border-radius: 16px;
            background: #17191f;
            color: #fff;
            text-decoration: none;
            transition: border-color 160ms ease, transform 160ms ease;
        }

        a:hover {
            transform: translateY(-3px);
            border-color: #9747ff;
        }

        a:focus-visible {
            outline: 3px solid #c69aff;
            outline-offset: 3px;
        }

        a strong {
            display: block;
            margin-bottom: 8px;
            color: #c69aff;
            font-family: "Poppins", sans-serif;
            font-size: 1.25rem;
        }

        a span {
            color: #d3d3d8;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            body {
                padding: 32px 20px;
            }

            header {
                margin-bottom: 56px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            a {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <img src="tecboard/img/logo-tecboard-branco.png" alt="Tecboard">
        </header>

        <section aria-labelledby="page-title">
            <h1 id="page-title"><span>Projetos</span> de Front-end</h1>
            <p class="intro">Explore os projetos desenvolvidos na disciplina de Programação Front-end.</p>

            <h2>Projetos disponíveis</h2>
            <ul>
                <li>
                    <a href="tecboard/">
                        <strong>Tecboard</strong>
                        <span>Monitoramento em tempo real com alertas inteligentes.</span>
                    </a>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
